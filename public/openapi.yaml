"openapi": "3.1.1"
"info":
  "title": "Nutrition & Fitness App API"
  "description": "API for the Nutrition & Fitness PWA. Use these endpoints to ingest food logs,

    \    body metrics, and workouts from a Custom GPT or other integrations.


    \    Note: The schema is publicly accessible. Sending requests requires the

    \    X-API-KEY header (shared key) and userEmail in the body."
  "version": "1.0.0"
"servers":
  - "url": "https://nutrition-fitness-app-nine.vercel.app"
    "description": "Production"
"security":
  - "apiKeyAuth": []
"paths":
  "/api/v1/ingest/food":
    "post":
      "summary": "Ingest food log"
      "description": "Log a meal or food entry. Supports full nutrient profiles including macros,

        \        fiber, vitamins, minerals, and electrolytes. Send items with nutrients per

        \        food item; totals are computed server-side."
      "operationId": "ingestFood"
      "tags":
        - "Ingest"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "userEmail":
                  "type": "string"
                  "format": "email"
                  "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                "eatenAt":
                  "type": "string"
                  "format": "date-time"
                  "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                "mealType":
                  "default": "snack"
                  "type": "string"
                "rawText":
                  "type": "string"
                "ranges":
                  "type": "object"
                  "additionalProperties":
                    "type": "object"
                    "properties":
                      "low":
                        "type": "number"
                      "high":
                        "type": "number"
                "confidenceScore":
                  "type": "number"
                  "minimum": 0
                  "maximum": 1
                "items":
                  "type": "array"
                  "description": "Food items with nutrients per item. Totals are computed server-side. If empty, an empty log is created."
                  "items":
                    "type": "object"
                    "properties":
                      "name":
                        "type": "string"
                      "brand":
                        "type": "string"
                      "quantity":
                        "type": "number"
                        "minimum": 0
                      "unit":
                        "type": "string"
                      "notes":
                        "type": "string"
                      "nutrients":
                        "type": "object"
                        "additionalProperties":
                          "anyOf":
                            - "type": "number"
                            - "type": "string"
                              "nullable": true
                              "enum":
                                - null
                      "ranges":
                        "type": "object"
                        "additionalProperties":
                          "type": "object"
                          "properties":
                            "low":
                              "type": "number"
                            "high":
                              "type": "number"
                      "confidenceScore":
                        "type": "number"
                        "minimum": 0
                        "maximum": 1
                    "required":
                      - "nutrients"
              "required":
                - "userEmail"
                - "eatenAt"
      "responses":
        "200":
          "description": "Food log created successfully"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "id":
                    "type": "string"
                    "format": "uuid"
                    "description": "ID of the created food log"
                  "ok":
                    "type": "boolean"
                    "example": true
        "400":
          "description": "Validation failed (invalid body) or User not found"
        "401":
          "description": "Invalid or missing API key"
        "500":
          "description": "Server error"
  "/api/v1/ingest/body":
    "post":
      "summary": "Ingest body metrics"
      "description": "Log a body measurement (weight, body fat, etc.). At minimum, weight in kg

        \        and measuredAt timestamp are required."
      "operationId": "ingestBody"
      "tags":
        - "Ingest"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "userEmail":
                  "type": "string"
                  "format": "email"
                  "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                "measuredAt":
                  "type": "string"
                  "format": "date-time"
                  "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                "weightKg":
                  "type": "number"
                  "minimum": 0
                  "exclusiveMinimum": true
                "bodyFatPercent":
                  "type": "number"
                  "minimum": 0
                  "maximum": 100
                "leanMassKg":
                  "type": "number"
                  "minimum": 0
                  "exclusiveMinimum": true
                "waistCm":
                  "type": "number"
                  "minimum": 0
                  "exclusiveMinimum": true
              "required":
                - "userEmail"
                - "measuredAt"
                - "weightKg"
      "responses":
        "200":
          "description": "Body metric created successfully"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "id":
                    "type": "string"
                    "format": "uuid"
                    "description": "ID of the created body metric"
                  "ok":
                    "type": "boolean"
                    "example": true
        "400":
          "description": "Validation failed or User not found"
        "401":
          "description": "Invalid or missing API key"
        "500":
          "description": "Server error"
  "/api/v1/ingest/workout":
    "post":
      "summary": "Ingest workout"
      "description": "Log a workout session. Can include strength exercises (with sets, reps,

        \        weight) and/or cardio activities (duration, distance, calories burned)."
      "operationId": "ingestWorkout"
      "tags":
        - "Ingest"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "userEmail":
                  "type": "string"
                  "format": "email"
                  "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
                "startedAt":
                  "type": "string"
                  "format": "date-time"
                  "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                "endedAt":
                  "type": "string"
                  "format": "date-time"
                  "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                "title":
                  "default": "Workout"
                  "type": "string"
                "notes":
                  "type": "string"
                "entries":
                  "type": "array"
                  "default": []
                  "description": "Strength and/or cardio exercises in this session"
                  "items":
                    "oneOf":
                      - "type": "object"
                        "properties":
                          "type":
                            "type": "string"
                            "enum":
                              - "strength"
                          "exercise":
                            "type": "string"
                          "sets":
                            "default": []
                            "type": "array"
                            "items":
                              "type": "object"
                              "properties":
                                "reps":
                                  "type": "number"
                                "weightKg":
                                  "type": "number"
                                "durationSeconds":
                                  "type": "number"
                        "required":
                          - "type"
                      - "type": "object"
                        "properties":
                          "type":
                            "type": "string"
                            "enum":
                              - "cardio"
                          "activity":
                            "type": "string"
                          "durationMinutes":
                            "type": "number"
                          "distanceKm":
                            "type": "number"
                          "caloriesBurned":
                            "type": "number"
                        "required":
                          - "type"
                    "discriminator":
                      "propertyName": "type"
              "required":
                - "userEmail"
                - "startedAt"
      "responses":
        "200":
          "description": "Workout created successfully"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "id":
                    "type": "string"
                    "format": "uuid"
                    "description": "ID of the created workout"
                  "ok":
                    "type": "boolean"
                    "example": true
        "400":
          "description": "Validation failed or User not found"
        "401":
          "description": "Invalid or missing API key"
        "500":
          "description": "Server error"
"components":
  "securitySchemes":
    "apiKeyAuth":
      "type": "apiKey"
      "in": "header"
      "name": "X-API-KEY"
      "description": "Shared API key for authentication. Configure this in the app settings and add it to your GPT Action."
  "schemas":
    "IngestFoodRequest":
      "type": "object"
      "properties":
        "userEmail":
          "type": "string"
          "format": "email"
          "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        "eatenAt":
          "type": "string"
          "format": "date-time"
          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
        "mealType":
          "default": "snack"
          "type": "string"
        "rawText":
          "type": "string"
        "ranges":
          "type": "object"
          "additionalProperties":
            "type": "object"
            "properties":
              "low":
                "type": "number"
              "high":
                "type": "number"
        "confidenceScore":
          "type": "number"
          "minimum": 0
          "maximum": 1
        "items":
          "type": "array"
          "description": "Food items with nutrients per item. Totals are computed server-side. If empty, an empty log is created."
          "items":
            "type": "object"
            "properties":
              "name":
                "type": "string"
              "brand":
                "type": "string"
              "quantity":
                "type": "number"
                "minimum": 0
              "unit":
                "type": "string"
              "notes":
                "type": "string"
              "nutrients":
                "type": "object"
                "additionalProperties":
                  "anyOf":
                    - "type": "number"
                    - "type": "string"
                      "nullable": true
                      "enum":
                        - null
              "ranges":
                "type": "object"
                "additionalProperties":
                  "type": "object"
                  "properties":
                    "low":
                      "type": "number"
                    "high":
                      "type": "number"
              "confidenceScore":
                "type": "number"
                "minimum": 0
                "maximum": 1
            "required":
              - "nutrients"
      "required":
        - "userEmail"
        - "eatenAt"
    "FoodItem":
      "type": "object"
      "properties":
        "name":
          "type": "string"
        "brand":
          "type": "string"
        "quantity":
          "type": "number"
          "minimum": 0
        "unit":
          "type": "string"
        "notes":
          "type": "string"
        "nutrients":
          "type": "object"
          "additionalProperties":
            "anyOf":
              - "type": "number"
              - "type": "string"
                "nullable": true
                "enum":
                  - null
        "ranges":
          "type": "object"
          "additionalProperties":
            "type": "object"
            "properties":
              "low":
                "type": "number"
              "high":
                "type": "number"
        "confidenceScore":
          "type": "number"
          "minimum": 0
          "maximum": 1
      "required":
        - "nutrients"
    "IngestBodyRequest":
      "type": "object"
      "properties":
        "userEmail":
          "type": "string"
          "format": "email"
          "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        "measuredAt":
          "type": "string"
          "format": "date-time"
          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
        "weightKg":
          "type": "number"
          "minimum": 0
          "exclusiveMinimum": true
        "bodyFatPercent":
          "type": "number"
          "minimum": 0
          "maximum": 100
        "leanMassKg":
          "type": "number"
          "minimum": 0
          "exclusiveMinimum": true
        "waistCm":
          "type": "number"
          "minimum": 0
          "exclusiveMinimum": true
      "required":
        - "userEmail"
        - "measuredAt"
        - "weightKg"
    "IngestWorkoutRequest":
      "type": "object"
      "properties":
        "userEmail":
          "type": "string"
          "format": "email"
          "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        "startedAt":
          "type": "string"
          "format": "date-time"
          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
        "endedAt":
          "type": "string"
          "format": "date-time"
          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
        "title":
          "default": "Workout"
          "type": "string"
        "notes":
          "type": "string"
        "entries":
          "type": "array"
          "default": []
          "description": "Strength and/or cardio exercises in this session"
          "items":
            "oneOf":
              - "type": "object"
                "properties":
                  "type":
                    "type": "string"
                    "enum":
                      - "strength"
                  "exercise":
                    "type": "string"
                  "sets":
                    "default": []
                    "type": "array"
                    "items":
                      "type": "object"
                      "properties":
                        "reps":
                          "type": "number"
                        "weightKg":
                          "type": "number"
                        "durationSeconds":
                          "type": "number"
                "required":
                  - "type"
              - "type": "object"
                "properties":
                  "type":
                    "type": "string"
                    "enum":
                      - "cardio"
                  "activity":
                    "type": "string"
                  "durationMinutes":
                    "type": "number"
                  "distanceKm":
                    "type": "number"
                  "caloriesBurned":
                    "type": "number"
                "required":
                  - "type"
            "discriminator":
              "propertyName": "type"
      "required":
        - "userEmail"
        - "startedAt"
    "WorkoutEntry":
      "oneOf":
        - "type": "object"
          "properties":
            "type":
              "type": "string"
              "enum":
                - "strength"
            "exercise":
              "type": "string"
            "sets":
              "default": []
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "reps":
                    "type": "number"
                  "weightKg":
                    "type": "number"
                  "durationSeconds":
                    "type": "number"
          "required":
            - "type"
        - "type": "object"
          "properties":
            "type":
              "type": "string"
              "enum":
                - "cardio"
            "activity":
              "type": "string"
            "durationMinutes":
              "type": "number"
            "distanceKm":
              "type": "number"
            "caloriesBurned":
              "type": "number"
          "required":
            - "type"
      "discriminator":
        "propertyName": "type"
    "StrengthEntry":
      "type": "object"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "strength"
        "exercise":
          "type": "string"
        "sets":
          "default": []
          "type": "array"
          "items":
            "type": "object"
            "properties":
              "reps":
                "type": "number"
              "weightKg":
                "type": "number"
              "durationSeconds":
                "type": "number"
      "required":
        - "type"
    "CardioEntry":
      "type": "object"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "cardio"
        "activity":
          "type": "string"
        "durationMinutes":
          "type": "number"
        "distanceKm":
          "type": "number"
        "caloriesBurned":
          "type": "number"
      "required":
        - "type"
